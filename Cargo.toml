[package]
name = "horizon-emu"
version = "0.1.0"
edition = "2024"
description = "Emulator that boots the Horizon OS kernel"
publish = false

[dependencies]
aes = "0.8"
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
bincode = "1.3.3"
font8x8 = { version = "0.3", default-features = false }
hmac = "0.12"
libc = "0.2"
minifb = { version = "0.28", default-features = false }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
png = "0.17"
rand_chacha = "0.3"
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp"] }

[profile.dev]
opt-level = 1
