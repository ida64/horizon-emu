[package]
name = "horizon-emu"
version = "0.1.0"
edition = "2024"
description = "Emulator that boots the Horizon OS kernel"
publish = false

[dependencies]
aes = "0.8"
font8x8 = { version = "0.3", default-features = false }
libc = "0.2"
minifb = { version = "0.28", default-features = false }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.dev]
opt-level = 1
